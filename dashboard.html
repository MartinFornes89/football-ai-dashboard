<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Football AI Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 20px; }
.container { max-width: 1400px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 30px; }
.header h1 { font-size: 2.5rem; margin-bottom: 10px; }
.filters { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; }
.filter-group { display: flex; flex-direction: column; gap: 5px; }
.filter-group label { font-size: 0.9rem; opacity: 0.9; }
.filter-group select, .filter-group input { padding: 8px 15px; border-radius: 8px; border: none; font-size: 1rem; }
button { background: #4CAF50; color: white; padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
button:hover { background: #45a049; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
.stat-card { background: rgba(255,255,255,0.15); padding: 20px; border-radius: 12px; text-align: center; }
.stat-card h3 { font-size: 2rem; margin-bottom: 5px; }
.stat-card p { opacity: 0.8; }
.matches { display: grid; gap: 20px; }
.match-card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
.match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.match-teams { display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; }
.match-teams span { flex: 1; }
.match-teams .vs { flex: 0; padding: 0 15px; opacity: 0.7; font-size: 1rem; }
.predictions { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.prediction-group h4 { margin-bottom: 10px; font-size: 0.9rem; opacity: 0.8; }
.prob-bar { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.prob-fill { height: 25px; border-radius: 5px; display: flex; align-items: center; padding: 0 10px; font-weight: 600; transition: 0.3s; }
.prob-1 { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
.prob-X { background: linear-gradient(90deg, #FF9800, #FFC107); }
.prob-2 { background: linear-gradient(90deg, #F44336, #E91E63); }
.value-bets { background: rgba(255,215,0,0.2); border: 2px solid #FFD700; border-radius: 8px; padding: 15px; margin-top: 15px; }
.value-bet-item { background: rgba(255,215,0,0.3); padding: 8px 12px; border-radius: 5px; margin-bottom: 8px; font-weight: 600; }
.confidence { display: inline-block; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }
.loading { text-align: center; padding: 50px; font-size: 1.2rem; }
.error { background: rgba(244,67,54,0.3); border: 2px solid #F44336; padding: 20px; border-radius: 10px; text-align: center; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>⚽ Football AI Betting Dashboard</h1>
<p>AI-powered predictions with xG, PPDA & injury analysis</p>
</div>
<div class="filters">
<div class="filter-group">
<label>League</label>
<select id="leagueFilter">
<option value="all">All leagues</option>
<option value="Premier League">Premier League</option>
<option value="La Liga">La Liga</option>
<option value="Serie A">Serie A</option>
<option value="Bundesliga">Bundesliga</option>
<option value="Champions League">Champions League</option>
</select>
</div>
<div class="filter-group">
<label>Match Day</label>
<select id="dayFilter">
<option value="all">All upcoming days</option>
</select>
</div>
<div class="filter-group">
<label>Min Value %</label>
<input type="number" id="valueFilter" value="0" min="0" step="1">
</div>
<div class="filter-group">
<label>Min Data Quality %</label>
<input type="number" id="confFilter" value="60" min="0" max="100" step="5">
</div>
<div class="filter-group">
<label>Probability Market</label>
<select id="probabilityMarketFilter">
<option value="all">Any outcome</option>
<option value="home">Home win</option>
<option value="draw">Draw</option>
<option value="away">Away win</option>
<option value="over">Over 2.5 goals</option>
<option value="under">Under 2.5 goals</option>
</select>
</div>
<div class="filter-group">
<label>Min Probability %</label>
<input type="number" id="probabilityFilter" value="0" min="0" max="100" step="1">
</div>
<button id="refreshButton" onclick="refreshData()">Refresh Data</button>
</div>
<div class="stats" id="stats"></div>
<div class="matches" id="matches"></div>
</div>
<script>
let allPredictions = [];
function loadPredictions() {
  document.getElementById('matches').innerHTML = '<div class="loading">Loading predictions...</div>';
  fetch('/api/predictions')
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        allPredictions = data.data || [];
        populateDayFilter();
        updateStats(data);
        filterAndDisplay();
      } else {
        document.getElementById('matches').innerHTML = '<div class="error">Error: ' + (data.error || 'Unknown error') + '</div>';
      }
    })
    .catch(e => {
      document.getElementById('matches').innerHTML = '<div class="error">Error: ' + e.message + '</div>';
    });
}
async function refreshData() {
  const button = document.getElementById('refreshButton');
  button.disabled = true;
  button.textContent = 'Updating...';
  document.getElementById('matches').innerHTML = '<div class="loading">Fetching the latest fixtures and rebuilding predictions...</div>';
  try {
    const response = await fetch('/api/refresh', { method: 'POST' });
    const result = await response.json();
    if (!response.ok || !result.success) {
      throw new Error(result.error || 'Could not update data.');
    }
    loadPredictions();
  } catch (error) {
    document.getElementById('matches').innerHTML = '<div class="error">' + error.message + '</div>';
  } finally {
    button.disabled = false;
    button.textContent = 'Refresh Data';
  }
}
function updateStats(data) {
  const predictions = data.data || [];
  const valueBets = predictions.filter(p => (p.value_bets || []).length > 0).length;
  const avgDataQuality = predictions.length > 0 ? (predictions.reduce((s, p) => s + (p.confidence || 0), 0) / predictions.length).toFixed(0) : 0;
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><h3>' + (data.count || 0) + '</h3><p>Matches</p></div>' +
    '<div class="stat-card"><h3>' + valueBets + '</h3><p>Value Bets</p></div>' +
    '<div class="stat-card"><h3>' + avgDataQuality + '%</h3><p>Avg Data Quality</p></div>' +
    '<div class="stat-card"><h3>' + (data.updated ? new Date(data.updated).toLocaleString('en-GB') : 'N/A') + '</h3><p>Updated</p></div>';
}
function populateDayFilter() {
  const dayFilter = document.getElementById('dayFilter');
  const selectedDay = dayFilter.value;
  const days = [...new Set(allPredictions.map(p => p.date).filter(date => /^\d{4}-\d{2}-\d{2}$/.test(date)))].sort();
  dayFilter.innerHTML = '<option value="all">All upcoming days</option>';
  days.forEach(day => {
    const option = document.createElement('option');
    option.value = day;
    option.textContent = new Intl.DateTimeFormat('en-GB', {
      weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
    }).format(new Date(day + 'T00:00:00Z'));
    dayFilter.appendChild(option);
  });
  if (days.includes(selectedDay)) dayFilter.value = selectedDay;
}
function filterAndDisplay() {
  const league = document.getElementById('leagueFilter').value;
  const selectedDay = document.getElementById('dayFilter').value;
  const minVal = parseFloat(document.getElementById('valueFilter').value) || 0;
  const minConf = parseFloat(document.getElementById('confFilter').value) || 0;
  const probabilityMarket = document.getElementById('probabilityMarketFilter').value;
  const minProbability = parseFloat(document.getElementById('probabilityFilter').value) || 0;
  let filtered = allPredictions.filter(p => {
    const kickoffTime = Date.parse((p.date || '') + 'T' + (p.time || '00:00') + ':00Z');
    const kickoffUpcoming = Number.isFinite(kickoffTime) && kickoffTime > Date.now();
    const leagueMatch = league === 'all' || p.league === league;
    const dayMatch = selectedDay === 'all' || p.date === selectedDay;
    const dataQualityMatch = (p.confidence || 0) >= minConf;
    const valueMatch = minVal <= 0 || (p.value_bets || []).some(v => parseFloat(v['value%']) >= minVal);
    const oneXTwo = (p.predictions && p.predictions['1X2']) || {};
    const totals = (p.predictions && p.predictions.totals) || {};
    const probabilities = {
      home: parseFloat(oneXTwo['1']) || 0,
      draw: parseFloat(oneXTwo['X']) || 0,
      away: parseFloat(oneXTwo['2']) || 0,
      over: parseFloat(totals.over2_5) || 0,
      under: parseFloat(totals.under2_5) || 0
    };
    const selectedProbabilities = probabilityMarket === 'all'
      ? Object.values(probabilities)
      : [probabilities[probabilityMarket]];
    const probabilityMatch = selectedProbabilities.some(probability => probability >= minProbability);
    return kickoffUpcoming && leagueMatch && dayMatch && dataQualityMatch && valueMatch && probabilityMatch;
  });
  if (filtered.length === 0) {
    document.getElementById('matches').innerHTML = '<div class="error">No matches found</div>';
    return;
  }
  const html = filtered.map(p => {
    const pred = (p.predictions && p.predictions['1X2']) || {};
    const totals = (p.predictions && p.predictions.totals) || {};
    const valueBetsList = p.value_bets || [];
    const valueBetsHTML = valueBetsList.length > 0 ?
      '<div class="value-bets"><h4>VALUE BETS:</h4>' +
      valueBetsList.map(v => '<div class="value-bet-item">' + v.type + ': +' + v['value%'] + '% edge (' + v.prob + '% prob)</div>').join('') +
      '</div>' : '';
    const injuries = p.injuries || {};
    return '<div class="match-card">' +
      '<div class="match-header"><span>' + (p.league || '') + '</span><span class="confidence" title="Heuristic score based on data availability, odds, and injuries; not a probability that the prediction is correct.">Data quality: ' + (p.confidence || 0) + '%</span></div>' +
      '<div class="match-teams"><span>' + (p.home || '') + '</span><span class="vs">vs</span><span>' + (p.away || '') + '</span></div>' +
      '<p style="opacity:0.8;margin-bottom:15px">' + (p.date || '') + ' ' + (p.time || '') + ' | Lambda: ' + (p.lambda_home || '?') + ' vs ' + (p.lambda_away || '?') + ' | Injuries: ' + (injuries.home || 0) + '/' + (injuries.away || 0) + '</p>' +
      '<div class="predictions">' +
      '<div><h4>1X2 Probabilities</h4>' +
      '<div class="prob-bar"><div class="prob-fill prob-1" style="width:' + (pred['1'] || 0) + '%">1: ' + (pred['1'] || 0) + '%</div></div>' +
      '<div class="prob-bar"><div class="prob-fill prob-X" style="width:' + (pred['X'] || 0) + '%">X: ' + (pred['X'] || 0) + '%</div></div>' +
      '<div class="prob-bar"><div class="prob-fill prob-2" style="width:' + (pred['2'] || 0) + '%">2: ' + (pred['2'] || 0) + '%</div></div></div>' +
      '<div><h4>Over/Under 2.5</h4>' +
      '<div class="prob-bar"><div class="prob-fill prob-1" style="width:' + (totals.over2_5 || 0) + '%">Over: ' + (totals.over2_5 || 0) + '%</div></div>' +
      '<div class="prob-bar"><div class="prob-fill prob-2" style="width:' + (totals.under2_5 || 0) + '%">Under: ' + (totals.under2_5 || 0) + '%</div></div></div>' +
      '</div>' + valueBetsHTML + '</div>';
  }).join('');
  document.getElementById('matches').innerHTML = html;
}
document.getElementById('leagueFilter').addEventListener('change', filterAndDisplay);
document.getElementById('dayFilter').addEventListener('change', filterAndDisplay);
document.getElementById('valueFilter').addEventListener('input', filterAndDisplay);
document.getElementById('confFilter').addEventListener('input', filterAndDisplay);
document.getElementById('probabilityMarketFilter').addEventListener('change', filterAndDisplay);
document.getElementById('probabilityFilter').addEventListener('input', filterAndDisplay);
setInterval(filterAndDisplay, 60000);
loadPredictions();
</script>
</body>
</html>
